name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,yaml]"
          pip install ruff

      - name: Lint with ruff
        run: |
          ruff check antiai tests examples

      - name: Run test suite
        run: |
          pytest -v

      - name: Smoke test CLI
        run: |
          antiai --version
          antiai validate
          antiai demo --stateless
          antiai demo --aggressive
